
# .github/workflows/ci.yml
#
# Purpose:
# Continuous integration — runs on every push to
# dev, testing, and staging branches.
#
# Responsibilities:
# - Run full test suite
# - Lint and type check
# - Fail fast on any broken code
#
# This workflow is the quality gate for all branches.
# Code that fails here must not be promoted.


name: CI

on:
  push:
    branches:
      - dev
      - testing
      - staging
  pull_request:
    branches:
      - main
      - staging
      - testing

permissions:
  contents: read

jobs:

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0                  # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405              # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=engine \
            --cov=schemas \
            --cov-report=term-missing \
            --cov-fail-under=40

  lint:
    name: Lint and Type Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0                   # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405              # v6.2.0
        with:
          python-version: "3.11"

      - name: Install dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          ruff check .

      - name: Ruff format check
        run: |
          ruff format --check .