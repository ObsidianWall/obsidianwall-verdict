# .github/workflows/verdict-ci.yml
#
# ObsidianWall Verdict — CI Pipeline
#
# Triggers:
# - Push to main or dev branches
# - Pull requests targeting main
#
# Jobs:
# - lint:        ruff + bandit + semgrep + pip-audit +
#                trufflehog + license compliance
# - test:        pytest with coverage enforcement
#                matrix: Python 3.11, 3.12, 3.13
# - action-test: integration test — exercises the full
#                GitHub Action against a real sample plan
# - build:       package build verification
#
# Security controls (secure-by-design):
# - ruff          → style and lint enforcement
# - bandit        → Python security SAST
# - semgrep       → deep security SAST (catches dynamic urllib, etc.)
# - pip-audit     → SCA — dependency CVE scanning
# - trufflehog    → secret scanning — detects leaked credentials
#                   before they reach main
# - pip-licenses  → license compliance — blocks GPL/AGPL dependencies
#                   that would create legal exposure for enterprise adopters
# - scoped perms  → contents: read only on all jobs
# - pinned SHAs   → all actions pinned to exact commit SHA

name: ObsidianWall Verdict CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ===================================================
  # STATIC ANALYSIS
  #
  # Full security gate — must pass before tests run.
  # Order matters:
  #   1. ruff lint + format   → style and correctness
  #   2. bandit               → Python security SAST
  #   3. semgrep              → deep SAST (dynamic URLs,
  #                             injection patterns, etc.)
  #   4. pip-audit            → dependency CVE scanning
  #   5. trufflehog           → secret scanning
  #   6. pip-licenses         → license compliance check
  #                             blocks GPL/AGPL dependencies
  # ===================================================

  lint:
    name: Static Analysis
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0                  # v6.0.3
        with:
          fetch-depth: 0  # full history required by TruffleHog

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405               # v6.2.0
        with:
          python-version: "3.11"

      - name: Install lint dependencies
        run: |
          pip install ruff bandit

      - name: Ruff lint
        run: |
          ruff check engine/ schemas/ audit/ cli/

      - name: Ruff format check
        run: |
          ruff format --check .

      - name: Bandit security scan
        run: |
          bandit -r engine/ schemas/ audit/ -ll -f txt

      - name: Semgrep SAST
        run: |
          pip install semgrep "pyjwt>=2.13.0"
          semgrep --config=auto engine/ schemas/ audit/ cli/ \
            --error --quiet

      - name: pip-audit SCA
        run: |
          pip install --upgrade pip
          pip install pip-audit
          pip-audit

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51         # v3.95.5
        with:
           path:       ./
           base:       ${{ github.event.before }}
           head:       ${{ github.sha }}
           extra_args: --only-verified

      - name: License compliance check
        # Blocks the build if any dependency carries a GPL or AGPL
        # license that would create legal exposure for enterprise adopters.
        # Permitted licenses: MIT, Apache-2.0, BSD variants, ISC, PSF.
        run: |
          pip install -e ".[dev]"
          pip install pip-licenses
          pip-licenses \
            --fail-on="GPL-2.0-only;GPL-2.0-or-later;GPL-3.0-only;GPL-3.0-or-later;AGPL-3.0-only;AGPL-3.0-or-later;AGPL-3.0" \
            --ignore-packages obsidianwall-verdict

  # ===================================================
  # TEST SUITE
  #
  # Runs full test suite across Python 3.11, 3.12, 3.13.
  # Matrix testing ensures compatibility across all
  # supported Python versions before any code reaches main.
  #
  # Coverage measured across:
  #   engine/        core evaluation pipeline
  #   schemas/       policy schema validation
  #   audit/         audit logger
  #   notifications/ dispatch channels
  #   telemetry/     governance history store
  # ===================================================

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    needs: lint
    env:
      PYTHONPATH: ${{ github.workspace }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0                  # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405               # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run full test suite with coverage gate
        run: |
          python -m pytest tests/ -v \
            --cov=engine \
            --cov=schemas \
            --cov=audit \
            --cov=notifications \
            --cov=telemetry \
            --cov-report=term-missing \
            --cov-fail-under=90

  # ===================================================
  # ACTION SELF-TEST
  #
  # Integration test — exercises Verdict CLI directly
  # against real sample files using a local install.
  #
  # Why local install instead of `uses: ./`:
  #   `uses: ./` triggers action.yml which installs from
  #   PyPI. During dev/pre-release, the current PyPI
  #   version may not include data files (e.g. YAML maps)
  #   added in the current commit. Installing from the
  #   local checkout ensures the integration test always
  #   runs against the actual code being reviewed.
  #
  # Tests:
  # - Governance decision produced correctly
  # - Risk score computed and non-zero
  # - Decision ID issued for audit trail
  # ===================================================

  action-test:
    name: Action Integration Test
    runs-on: ubuntu-24.04
    needs: test
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0                  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405               # v6.2.0
        with:
          python-version: "3.11"

      - name: Install Verdict from local repo
        # Local install ensures data files (YAML maps, etc.)
        # present in the current commit are available at runtime.
        # This avoids the PyPI version lag during development.
        run: |
          pip install -e .

      - name: Run Verdict — over budget (expect DENY)
        id: verdict_deny
        run: |
          set +e

          verdict evaluate \
            --plan   samples/terraform_plan.json \
            --policy policies/cost/basic_budget.yaml \
            --role   engineer \
            > /tmp/verdict_output.txt 2>&1

          EXIT_CODE=$?

          # Always surface output in CI logs
          # regardless of governance decision
          cat /tmp/verdict_output.txt

          # Parse governance outputs from JSON artifact
          DECISION=$(python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/verdict_output.txt'))
              print(data.get('decision', ''))
          except Exception:
              print('')
          " 2>/dev/null || echo "")

          RISK=$(python3 -c "
          import json
          try:
              data = json.load(open('/tmp/verdict_output.txt'))
              print(data.get('risk_summary', {}).get('overall_risk_score', 0))
          except Exception:
              print('0')
          " 2>/dev/null || echo "0")

          DECISION_ID=$(python3 -c "
          import json
          try:
              data = json.load(open('/tmp/verdict_output.txt'))
              print(data.get('decision_id', ''))
          except Exception:
              print('')
          " 2>/dev/null || echo "")

          echo "decision=${DECISION}"     >> "$GITHUB_OUTPUT"
          echo "risk_score=${RISK}"       >> "$GITHUB_OUTPUT"
          echo "decision_id=${DECISION_ID}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}"   >> "$GITHUB_OUTPUT"

      - name: Assert DENY decision
        run: |
          DECISION="${{ steps.verdict_deny.outputs.decision }}"
          echo "Decision: $DECISION"
          if [[ "$DECISION" != "DENY_WITH_OVERRIDE" && "$DECISION" != "DENY" ]]; then
            echo "❌ Expected DENY or DENY_WITH_OVERRIDE, got: $DECISION"
            exit 1
          fi
          echo "✅ Correct governance decision: $DECISION"

      - name: Assert risk score computed
        run: |
          RISK="${{ steps.verdict_deny.outputs.risk_score }}"
          echo "Risk score: $RISK"
          if [[ -z "$RISK" || "$RISK" == "0" ]]; then
            echo "❌ Expected non-zero risk score"
            exit 1
          fi
          echo "✅ Risk score: $RISK/100"

      - name: Assert decision ID issued
        run: |
          ID="${{ steps.verdict_deny.outputs.decision_id }}"
          echo "Decision ID: $ID"
          if [[ -z "$ID" ]]; then
            echo "❌ Expected decision_id in output"
            exit 1
          fi
          echo "✅ Decision ID: $ID"

  # ===================================================
  # BUILD VERIFICATION
  # ===================================================

  build:
    name: Build Verification
    runs-on: ubuntu-24.04
    needs: action-test

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0                  # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405               # v6.2.0
        with:
          python-version: "3.13"

      - name: Install build tools
        run: |
          pip install build

      - name: Build package
        run: |
          python -m build

      - name: Verify CLI entry point
        run: |
          pip install -e .
          verdict --help

      - name: Verify data files included in wheel
        # Confirms the YAML data files are packaged correctly.
        # This is the packaging bug that caused v0.5.0 to fail
        # in the action-test — catching it here before PyPI publish.
        run: |
          pip install build
          python -m build --wheel
          python3 -c "
          import zipfile, glob, sys
          wheels = glob.glob('dist/*.whl')
          if not wheels:
              print('No wheel found')
              sys.exit(1)
          whl = zipfile.ZipFile(wheels[0])
          yaml_files = [f for f in whl.namelist() if f.endswith('.yaml')]
          if not yaml_files:
              print('ERROR: No YAML files found in wheel')
              sys.exit(1)
          required = 'context/translators/cloudformation_resource_type_map.yaml'
          matches = [f for f in yaml_files if 'cloudformation_resource_type_map' in f]
          if not matches:
              print(f'ERROR: {required} not found in wheel')
              print('YAML files found:', yaml_files)
              sys.exit(1)
          print(f'✅ Found {len(yaml_files)} YAML file(s) in wheel')
          for f in yaml_files:
              print(f'  {f}')
          "