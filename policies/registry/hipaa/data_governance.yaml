# policies/registry/hipaa/data_governance.yaml
#
# Template: HIPAA Security Rule — PHI Infrastructure Governance
#
# Maps to:
#   § 164.312(a)(1)       — Access Control
#   § 164.312(a)(2)(iv)   — Encryption and Decryption
#   § 164.312(b)          — Audit Controls
#   § 164.312(e)(1)       — Transmission Security
#
# Policy type: composite
# Governance domains: data_governance + security + compliance
#
# HIPAA Security Rule technical safeguards span three domains:
#   data_governance  — PHI data handling intent and classification
#   security         — access controls and network exposure
#   compliance       — tagging and audit trail requirements
#
# Encryption at rest (§ 164.312(a)(2)(iv)) is evaluated
# directly against the infrastructure context — zero unencrypted
# databases are permitted, with no threshold.
#
# Hard DENY — HIPAA violations are not self-overridable.
# Only the compliance officer can authorize exceptions
# with documented justification.
#
# What to customize before using:
#   1. Replace owner with your HIPAA compliance team
#   2. Replace notification and approval roles with your
#      compliance officer and security lead
#
# How to test this template:
#   verdict test \
#     --plan   samples/terraform_plan.json \
#     --policy policies/registry/hipaa/data_governance.yaml \
#     --expect DENY

apiVersion: obsidianwall.io/v1
kind: Policy

metadata:
  name: hipaa_data_governance
  version: "0.1"
  owner: compliance-team        # Replace with your HIPAA compliance team
  description: "HIPAA Security Rule — PHI infrastructure governance across data, security, and compliance domains"

spec:
  policy_type: composite
  governance_domains:
    - data_governance           # § 164.312(a)(2)(iv) — encryption and PHI classification
    - security                  # § 164.312(a)(1), (e)(1) — access and transmission
    - compliance                # § 164.312(b) — audit controls via tagging

  inputs:
    - unencrypted_databases
    - public_storage_buckets
    - open_ingress_rules
    - untagged_resource_count
    - total_resource_count

  parameters:
    data:
      allow_pii_storage:         false  # PHI is regulated — explicit governance required
      allow_public_data_access:  false  # § 164.312(e)(1) — no public PHI transmission
      encryption_required:       true   # § 164.312(a)(2)(iv) — encrypt PHI at rest
      allow_cross_region_replication: false  # PHI must stay within approved regions
      require_data_lineage:      true   # § 164.312(b) — audit trail for PHI access

    security:
      max_open_ingress_rules: 0  # § 164.312(a)(1) — restrict access to PHI systems
      max_public_buckets:     0  # § 164.312(e)(1) — no publicly accessible PHI storage

    compliance:
      max_untagged_resources: 0  # § 164.312(b) — all PHI resources tagged for audit

  conditions:
    - id: phi_encryption_at_rest
      expression: "unencrypted_databases <= 0"
      description: "HIPAA § 164.312(a)(2)(iv) — PHI must be encrypted at rest, no exceptions"

    - id: no_public_phi_exposure
      expression: "public_storage_buckets <= security.max_public_buckets"
      description: "HIPAA § 164.312(e)(1) — PHI must not be publicly accessible"

    - id: restricted_phi_access
      expression: "open_ingress_rules <= security.max_open_ingress_rules"
      description: "HIPAA § 164.312(a)(1) — access to PHI systems must be explicitly controlled"

    - id: phi_resource_inventory
      expression: "untagged_resource_count <= compliance.max_untagged_resources"
      description: "HIPAA § 164.312(b) — all PHI-handling resources must be tagged for audit"

  decision:
    allow: ALLOW
    deny:  DENY
    warn:  ALLOW_WITH_NOTIFICATION

  governance:
    severity: critical

    notifications:
      - role: compliance_officer    # Replace with your HIPAA compliance officer
        channel: email
      - role: security_lead         # Replace with your security lead
        channel: email
      - role: engineering_lead
        channel: slack

    approvals:
      required:
        - compliance_officer
        - security_lead

  override:
    roles:
      - compliance_officer          # Only compliance officer may authorize exceptions
    requires_approval: true

  actions:
    - type: notify
      severity: critical
      message: "HIPAA governance violation. PHI infrastructure does not meet Security Rule requirements. Compliance officer review required."

    - type: log
      severity: info
      message: "HIPAA governance evaluation recorded in audit trail."