# policies/examples/nist-ai-rmf/ai_governance.yaml
#
# Template: NIST AI Risk Management Framework (AI RMF 1.0)
#
# Maps to:
#   GOVERN 1.1   — Policies and processes are in place
#   GOVERN 1.2   — Accountability is established
#   GOVERN 4.1   — Risk-tiered oversight mechanisms
#   MAP 1.5      — Context is established before deployment
#   MAP 5.1      — Likelihood of AI risks is assessed
#   MANAGE 1.3   — Human oversight is maintained
#   MANAGE 4.1   — Risk responses are monitored
#
# Policy type: composite
# Governance domains: ai_governance + resource_limits
#
# NIST AI RMF governance spans two domains:
#   ai_governance   — model provenance, human oversight,
#                     autonomous deployment controls
#   resource_limits — GPU quota enforcement, instance limits
#
# Hard DENY — AI governance is non-negotiable.
# The AI governance lead must approve all AI and GPU deployments.
#
# What to customize before using:
#   1. Replace owner with your AI governance team
#   2. Set limits.max_gpu_instances to your approved GPU allocation
#      (0 means all GPU deployments require explicit approval)
#   3. Replace notification and approval roles
#
# How to test this template:
#   verdict test \
#     --plan   terraform_plan.json \
#     --policy policies/examples/nist-ai-rmf/ai_governance.yaml \
#     --expect ALLOW

apiVersion: obsidianwall.io/v1
kind: Policy

metadata:
  name: nist_ai_rmf_governance
  version: "0.1"
  owner: ai-governance-team     # Replace with your AI governance team
  description: "NIST AI RMF 1.0 — AI system deployment governance and human oversight"

spec:
  policy_type: composite
  governance_domains:
    - ai_governance             # GOVERN, MAP, MANAGE functions
    - resource_limits           # GPU quota and instance controls

  inputs:
    - gpu_instance_count
    - ai_gpu_workloads

  parameters:
    ai:
      allow_autonomous_deployment:    false # MANAGE 1.3 — human oversight required
      require_human_approval:         true  # GOVERN 4.1 — risk-tiered oversight
      max_unreviewed_deployments:     0     # GOVERN 1.1 — governance required before deploy

    limits:
      max_gpu_instances: 0                  # MAP 1.5 — context established before deploy
                                            # Set to your approved GPU allocation
                                            # 0 means all GPU deployments require review

  conditions:
    - id: ai_deployment_requires_governance
      expression: "ai_gpu_workloads <= ai.max_unreviewed_deployments"
      description: "NIST AI RMF GOVERN 1.1 — AI deployments require formal governance review"

    - id: gpu_instances_require_approval
      expression: "gpu_instance_count <= limits.max_gpu_instances"
      description: "NIST AI RMF MAP 1.5 — GPU infrastructure context established before deploy"

  decision:
    allow: ALLOW
    deny:  DENY
    warn:  ALLOW_WITH_NOTIFICATION

  governance:
    severity: critical

    notifications:
      - role: ai_governance_lead    # Replace with your AI governance lead
        channel: email
      - role: security_lead         # Replace with your security lead
        channel: email
      - role: engineering_lead
        channel: slack

    approvals:
      required:
        - ai_governance_lead
        - security_lead

  override:
    roles:
      - ai_governance_lead
    requires_approval: true

  actions:
    - type: notify
      severity: critical
      message: "NIST AI RMF governance — AI deployment requires formal review. GPU workload blocked pending AI governance and security approval."

    - type: log
      severity: info
      message: "AI governance evaluation recorded in audit trail."