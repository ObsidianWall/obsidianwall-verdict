# docs/github-actions-example.yml
#
# ObsidianWall Verdict — Example Engineer Workflow
#
# Copy this file into your repo at:
#   .github/workflows/infrastructure-governance.yml
#
# What this does:
# 1. Generates a Terraform plan (or passes a CloudFormation template directly)
# 2. Runs ObsidianWall Verdict governance evaluation
# 3. Blocks deployment if policy is violated
# 4. Posts governance summary to the PR/workflow

name: Infrastructure Governance

on:
  pull_request:
    paths:
      - "**.tf"
      - "**.tfvars"
      # CloudFormation templates — add these if using CloudFormation.
      # Scope to your infra directory to avoid triggering on policy
      # YAML files (e.g. infra/**.yaml instead of **.yaml).
      - "infra/**.yaml"
      - "infra/**.json"
  push:
    branches:
      - main

jobs:

  governance:
    name: Governance Check
    runs-on: ubuntu-latest

    steps:

      # -------------------------------------------------
      # 1. Checkout your infrastructure code
      # -------------------------------------------------

      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3

      # -------------------------------------------------
      # 2. Set up Terraform
      #    Skip this step if using CloudFormation —
      #    pass your template directly to verdict evaluate.
      # -------------------------------------------------

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: "1.15.6"

      # -------------------------------------------------
      # 3. Generate infrastructure plan
      #
      # Terraform: generate plan JSON as shown below.
      # CloudFormation: skip this step and pass your
      #   template (JSON or YAML) directly to --plan.
      #   Format is auto-detected — no flag required.
      # -------------------------------------------------

      - name: Terraform Init
        run: terraform init
        working-directory: infra/

      - name: Terraform Plan
        run: |
          terraform plan -out=tfplan
          terraform show -json tfplan > terraform_plan.json
        working-directory: infra/

      # -------------------------------------------------
      # 4. Run ObsidianWall Verdict
      #
      # Pin to a release tag for production stability.
      # Current stable release: @v0.5.0
      # -------------------------------------------------

      - name: ObsidianWall Verdict
        id: verdict
        uses: ObsidianWall/obsidianwall-verdict@v0.5.0
        with:
          plan:           infra/terraform_plan.json
          policy:         .obsidianwall/cost_policy.yaml
          role:           engineer
          fail_on_deny:   "true"

      # -------------------------------------------------
      # 5. Use decision outputs in subsequent steps
      #    (only reached if fail_on_deny=false or ALLOW)
      # -------------------------------------------------

      - name: Log governance outcome
        if: always()
        run: |
          echo "Decision:          ${{ steps.verdict.outputs.decision }}"
          echo "Conditions Passed: ${{ steps.verdict.outputs.conditions_passed }}"
          echo "Risk Score:        ${{ steps.verdict.outputs.risk_score }}/100"
          echo "Severity:          ${{ steps.verdict.outputs.effective_severity }}"
          echo "Decision ID:       ${{ steps.verdict.outputs.decision_id }}"

      # -------------------------------------------------
      # 6. Proceed with deployment only if ALLOWED
      # -------------------------------------------------

      - name: Deploy infrastructure
        if: |
          steps.verdict.outputs.decision == 'ALLOW' ||
          steps.verdict.outputs.decision == 'ALLOW_WITH_NOTIFICATION'
        run: |
          echo "Governance authorized. Proceeding with deployment."
          # terraform apply ...